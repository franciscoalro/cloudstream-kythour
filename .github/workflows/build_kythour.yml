name: Build Kythour APK

on:
  push:
    branches: [master]
    paths-ignore:
      - '*.md'
      - '*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "kythour-build"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Build APK
      run: ./gradlew assemblePrereleaseRelease --no-daemon --stacktrace
      env:
        SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
        SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
        TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
        MDL_API_KEY: ${{ secrets.MDL_API_KEY }}
        MAL_KEY: ${{ secrets.MAL_KEY }}
        ANILIST_KEY: ${{ secrets.ANILIST_KEY }}

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CloudStream-Kythour-${{ github.sha }}
        path: app/build/outputs/apk/prerelease/release/*.apk
        retention-days: 30
