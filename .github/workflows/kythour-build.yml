name: Build Kythour Production APK

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish production APK as a GitHub release
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: kythour-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore production signing key
        env:
          PRODUCTION_KEYSTORE_BASE64: ${{ secrets.PRODUCTION_KEYSTORE_BASE64 || secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$PRODUCTION_KEYSTORE_BASE64"
          mkdir -p "$HOME/work/_temp/keystore"
          printf '%s' "$PRODUCTION_KEYSTORE_BASE64" | base64 --decode > "$HOME/work/_temp/keystore/kythour-production.keystore"
          test -s "$HOME/work/_temp/keystore/kythour-production.keystore"
          chmod 600 "$HOME/work/_temp/keystore/kythour-production.keystore"

      - name: Validate Kotlin ABI and production checks
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g\ -XX:MaxMetaspaceSize=768m\ -Dfile.encoding=UTF-8
        run: |
          chmod +x gradlew
          ./gradlew :library:checkKotlinAbi --stacktrace --no-daemon
          ./gradlew :app:lintPrereleaseProduction --stacktrace --no-daemon

      - name: Build production APK
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/kythour-production.keystore
          SIGNING_KEY_ALIAS: ${{ secrets.PRODUCTION_KEY_ALIAS || 'androiddebugkey' }}
          SIGNING_KEY_PASSWORD: ${{ secrets.PRODUCTION_KEY_PASSWORD || 'android' }}
          SIGNING_STORE_PASSWORD: ${{ secrets.PRODUCTION_STORE_PASSWORD || 'android' }}
        run: |
          cp "$HOME/work/_temp/keystore/kythour-production.keystore" "$SIGNING_STORE_FILE"
          chmod 600 "$SIGNING_STORE_FILE"
          chmod +x gradlew
          ./gradlew assemblePrereleaseProduction --stacktrace --no-daemon

      - name: Sign APK with stable key
        env:
          SIGNING_STORE_FILE: ${{ github.workspace }}/kythour-production.keystore
          SIGNING_KEY_ALIAS: ${{ secrets.PRODUCTION_KEY_ALIAS || 'androiddebugkey' }}
          SIGNING_KEY_PASSWORD: ${{ secrets.PRODUCTION_KEY_PASSWORD || 'android' }}
          SIGNING_STORE_PASSWORD: ${{ secrets.PRODUCTION_STORE_PASSWORD || 'android' }}
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/prerelease/production -name '*.apk' -type f -print -quit)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APK"
          test -x "$APKSIGNER"
          "$APKSIGNER" sign \
            --ks "$SIGNING_STORE_FILE" \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass "pass:$SIGNING_STORE_PASSWORD" \
            --key-pass "pass:$SIGNING_KEY_PASSWORD" \
            --out "$APK.signed" \
            "$APK"
          mv "$APK.signed" "$APK"

      - name: Validate and describe APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/prerelease/production -name '*.apk' -type f -print -quit)"
          test -n "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          test -x "$AAPT"
          VERSION_CODE="$($AAPT dump badging "$APK" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          VERSION_NAME="$($AAPT dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          PACKAGE_NAME="$($AAPT dump badging "$APK" | sed -n "s/package: name='\([^']*\)'.*/\1/p")"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          CERT_SHA256="$($APKSIGNER verify --print-certs "$APK" | sed -n 's/.*SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          EXPECTED_CERT_SHA256="42931699f937b2a2c68da3101c955088ec564cc9aa568f65586e04dcb555ee4f"
          echo "Package: $PACKAGE_NAME"
          echo "Version: $VERSION_NAME ($VERSION_CODE)"
          echo "Certificate SHA-256: $CERT_SHA256"
          test "$PACKAGE_NAME" = 'com.lagradost.cloudstream3.prerelease.debug'
          test "$CERT_SHA256" = "$EXPECTED_CERT_SHA256"
          test -n "$VERSION_CODE"
          OUT="kaplay-production-${VERSION_CODE}.apk"
          cp "$APK" "$OUT"
          APK_SHA256="$(sha256sum "$OUT" | tee "${OUT}.sha256" | cut -d' ' -f1)"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"
          echo "tag=app-v$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudstream-kythour-${{ steps.apk.outputs.version_code }}
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub pre-release
        if: github.event_name == 'push' || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.apk.outputs.tag }}
          APK: ${{ steps.apk.outputs.path }}
          VERSION_NAME: ${{ steps.apk.outputs.version_name }}
        run: |
          gh release create "$TAG" "$APK" "$APK.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CloudStream Kythour $VERSION_NAME" \
            --notes "Build automático do CloudStream Kythour Premium. A instalação continua exigindo confirmação explícita do Android." \
            --latest

      - name: Publish update manifest
        if: github.event_name == 'push' || inputs.publish_release
        env:
          VERSION_CODE: ${{ steps.apk.outputs.version_code }}
          VERSION_NAME: ${{ steps.apk.outputs.version_name }}
          TAG: ${{ steps.apk.outputs.tag }}
          APK: ${{ steps.apk.outputs.path }}
          PACKAGE_NAME: ${{ steps.apk.outputs.package_name }}
          CERT_SHA256: ${{ steps.apk.outputs.cert_sha256 }}
          APK_SHA256: ${{ steps.apk.outputs.apk_sha256 }}
        run: |
          python3 scripts/update-app-manifest.py
          python3 -m json.tool app-update.json >/dev/null
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add app-update.json
          if git diff --staged --quiet; then
            echo "Update manifest is already current"
            exit 0
          fi
          git commit -m "build: publish app update manifest [skip ci]"
          git fetch origin master
          if [ "$(git rev-parse origin/master)" != "$GITHUB_SHA" ]; then
            echo "master advanced during build; newer workflow will publish its manifest"
            exit 0
          fi
          git push origin HEAD:master
