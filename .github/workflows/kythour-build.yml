name: Build Kythour APK

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish APK as a GitHub pre-release
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: kythour-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore stable debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$DEBUG_KEYSTORE_BASE64"
          mkdir -p "$HOME/.android"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Build prerelease debug APK
        run: |
          chmod +x gradlew
          ./gradlew assemblePrereleaseDebug --stacktrace --no-daemon

      - name: Validate and describe APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/prerelease/debug -name '*.apk' -type f -print -quit)"
          test -n "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          test -x "$AAPT"
          VERSION_CODE="$($AAPT dump badging "$APK" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")"
          VERSION_NAME="$($AAPT dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          PACKAGE_NAME="$($AAPT dump badging "$APK" | sed -n "s/package: name='\([^']*\)'.*/\1/p")"
          test "$PACKAGE_NAME" = 'com.lagradost.cloudstream3.prerelease.debug'
          test -n "$VERSION_CODE"
          OUT="cloudstream-kythour-premium-${VERSION_CODE}-debug.apk"
          cp "$APK" "$OUT"
          sha256sum "$OUT" | tee "${OUT}.sha256"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=app-v$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudstream-kythour-${{ steps.apk.outputs.version_code }}
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub pre-release
        if: github.event_name == 'push' || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.apk.outputs.tag }}
          APK: ${{ steps.apk.outputs.path }}
          VERSION_NAME: ${{ steps.apk.outputs.version_name }}
        run: |
          gh release create "$TAG" "$APK" "$APK.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CloudStream Kythour $VERSION_NAME" \
            --notes "Build automático do CloudStream Kythour Premium. A instalação continua exigindo confirmação explícita do Android." \
            --prerelease
